<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Life Organizer</title>
  <link rel="stylesheet" href="/personal-calendar/calendar.css?v=mobile1">
</head>
<body>
<main>
  <header><a href="/admin/">← Back to Admin Panel</a><h1>Life Organizer</h1><p>Your shared household planner.</p></header>
  <p id="status" role="status" aria-live="polite"></p>
  <form id="login" hidden>
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
  </form>
  <section id="calendar" hidden>
    <nav class="organizer-nav" aria-label="Organizer views">
      <button type="button" data-mode="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-7 9 7v10h-6v-6H9v6H3z"/></svg>Today</button>
      <button type="button" data-mode="week"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v15H4z M8 3v6 M16 3v6 M4 11h16"/></svg>Calendar</button>
      <button type="button" data-mode="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z M8 12l3 3 5-6"/></svg><span class="desktop-task-label">Tasks &amp; Routines</span><span class="mobile-task-label">Tasks</span></button>
      <button type="button" data-mode="meals"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3v5a3 3 0 006 0V3 M7 3v18 M19 3c-4 2-4 8 0 9v9 M19 3v9"/></svg>Meal Plan</button>
      <button type="button" data-mode="bills"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2z M8 8h8 M8 12h8"/></svg>Bills</button>
      <button class="mobile-add" id="mobile-add" type="button" aria-label="Add an item">+</button>
    </nav>
    <div class="organizer-workspace">
    <section class="organizer-board" aria-labelledby="period">
    <div class="toolbar">
      <button id="previous" aria-label="Previous period">←</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next period">→</button>
      <label id="calendar-zoom">Calendar view <select id="view"><option value="week">Week</option><option value="month">Month</option></select></label>
      <button id="new-item">+ New item</button>
      <button id="refresh">Refresh</button>
      <button id="logout">Sign out</button>
    </div>
    <div id="daily-summary" hidden>
      <p id="daily-date"></p>
      <h2>Your day at a glance</h2>
      <div class="progress-card"><strong id="daily-progress"></strong><progress id="progress-bar" aria-label="Daily completion"></progress></div>
      <div class="dinner-card"><strong>Dinner</strong><span id="daily-dinner"></span></div>
    </div>
    <h2 id="period"></h2>
    <div id="days"></div>
    </section>
    <form id="editor">
      <h2 id="editor-title">Add an item</h2>
      <div class="fields">
        <label>Title <input name="title" maxlength="160" required></label>
        <label>Date <input name="starts_on" type="date"></label>
        <label>Start time <input name="starts_at" type="time"></label>
        <label>End time <input name="ends_at" type="time"></label>
        <label>Assigned to <select name="assignee"><option value="">Anyone</option><option>Wade</option><option>Annabella</option><option>Both</option></select></label>
        <label>Category <select name="category"><option>Task</option><option>Dinner</option><option>Bill</option><option>Event</option><option>Holiday</option><option>Cleaning</option><option>Pet care</option><option>Self-care</option><option>Date night</option></select></label>
        <label>Repeats <select name="repeat"><option value="none">Never</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label>
        <label id="amount-label" hidden>Bill amount ($) <input name="amount" type="number" min="0" max="9999999999.99" step=".01"></label>
      </div>
      <label>Notes <textarea name="notes" maxlength="2000"></textarea></label>
      <button id="save">Add item</button>
      <button id="cancel" type="button" hidden>Cancel edit</button>
    </form>
    </div>
    <details id="sharing" hidden>
      <summary>Manage shared access</summary>
      <form id="share">
        <label>Partner’s Supabase Auth user ID <input name="partner" placeholder="User UUID"></label>
        <p>Copy her user ID from Authentication → Users. Clear the field to remove access.</p>
        <button>Save access</button>
      </form>
    </details>
  </section>
</main>
<script type="module" src="/personal-calendar/calendar.js?v=mobile1"></script>
</body>
</html>
