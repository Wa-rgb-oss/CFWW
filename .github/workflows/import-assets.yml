name: Import CleanFreaks Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-assets.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download current CleanFreaks assets
        run: |
          mkdir -p assets/brand assets/hero assets/services assets/features assets/commercial
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/945c9b_e255348d542345ed9414812d95127d42~mv2.png" -o assets/brand/header-logo.png
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/11062b_4d43a8a891aa47d9907380cbf7e406d7~mv2.jpeg" -o assets/hero/window-cleaners.jpeg
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/945c9b_17a799f40ff34815935d003e2848d762~mv2.jpg" -o assets/services/window.jpg
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/945c9b_650d0cb31556422492df957e598f28d3~mv2.jpg" -o assets/services/vehicle.jpg
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/bccb7dec5d8846a4800d10a140a02d84.jpg" -o assets/services/pressure.jpg
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/945c9b_a8a5edbbd4b74ee1821055e0cb64d99d~mv2.jpg" -o assets/features/vehicle.jpg
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/11062b_2ca3f04731f84206ac348485e70780c7~mv2.jpg" -o assets/commercial/building.jpg
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/945c9b_fdd881dd696f476896e434c5bef9a80b~mv2.png" -o assets/brand/large-logo.png
          curl -L --fail --silent --show-error "https://static.wixstatic.com/media/945c9b_df7b9add41b242238f7122c8b35823bc~mv2.png" -o assets/brand/footer-logo.png

      - name: Commit imported assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Assets already imported."
          else
            git commit -m "Import CleanFreaks site assets"
            git push
          fi
