name: Verify Quote Notification Endpoint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-quote-endpoint.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public quote endpoint
        run: |
          set -e
          response="$(curl --fail-with-body -sS             -X POST             "https://jsrvcmsnsbuuhtwtqvoq.supabase.co/functions/v1/submit-quote-request"             -H "Content-Type: application/json"             --data '{"company_website":"bot-test","name":"Verification","email":"verify@example.com"}')"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
