name: Verify Careers Application Endpoints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-careers-applications.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public application endpoint without creating an application
        run: |
          set -e
          response="$(curl --fail-with-body -sS \
            -X POST \
            "https://jsrvcmsnsbuuhtwtqvoq.supabase.co/functions/v1/submit-career-application" \
            -H "Content-Type: application/json" \
            --data '{"company_website":"bot-verification","name":"Verification","email":"verify@example.com"}')"
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Verify reply endpoint requires Admin authentication
        run: |
          set -e
          code="$(curl -sS -o /tmp/reply.json -w "%{http_code}" \
            -X POST \
            "https://jsrvcmsnsbuuhtwtqvoq.supabase.co/functions/v1/send-career-reply" \
            -H "Content-Type: application/json" \
            --data '{"application_id":"00000000-0000-0000-0000-000000000000","subject":"Verification","message":"Verification"}')"
          cat /tmp/reply.json
          test "$code" = "401" -o "$code" = "403"
